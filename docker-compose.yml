services:
  drillix:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DRILLIX_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "h2"
      SPRING_AI_OPENAI_API_KEY: "${SPRING_AI_OPENAI_API_KEY:-}"
      SPRING_AI_OPENAI_BASE_URL: "${SPRING_AI_OPENAI_BASE_URL:-https://openai.bothub.chat/v1}"
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: "${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-deepseek-v4.1-flash-1017}"
    volumes:
      - drillix-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  drillix-data:
